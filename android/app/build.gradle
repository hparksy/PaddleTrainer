plugins { id 'com.android.application' }

// ../../VERSION is the one version number of both apps; versionCode 1.2.3 -> 10203
def ver = rootProject.file('../VERSION').text.trim()
def verCode = ver.tokenize('.').collect { it as int }.inject(0) { a, n -> a * 100 + n }

android {
    namespace 'com.parksy.paddletrainer'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.parksy.paddletrainer'
        minSdk 26
        targetSdk 35
        versionCode verCode
        versionName ver
    }
    buildTypes {
        // sideloaded APK: signed with this PC's debug key, so later builds install over it and keep the records
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

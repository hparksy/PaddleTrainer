plugins { id 'com.android.application' }

android {
    namespace 'com.parksy.paddletrainer'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.parksy.paddletrainer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        // sideloaded APK: signed with this PC's debug key, so later builds install over it and keep the records
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
